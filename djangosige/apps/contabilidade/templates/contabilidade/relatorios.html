{% extends "base/base.html" %}

{% block title %}Relatórios contábeis{% endblock %}

{% block content %}
<div class="page-head">
    <div class="page-head-texto">
        <h1 class="page-title">Relatórios</h1>
        <p class="page-subtitle">Relatórios da contabilidade interna das empresas do grupo</p>
    </div>
</div>

<section class="painel">
    <div class="tabela-caixa">
        <table class="tabela">
            <thead><tr><th scope="col">Relatório</th><th scope="col">O que mostra</th></tr></thead>
            <tbody>
                <tr>
                    <td class="forte"><a href="{% url 'contabilidade:relatorio_fiscal' %}">Relatório fiscal</a></td>
                    <td class="suave">Receita e tributos por mês, com o que falta pagar</td>
                </tr>
            </tbody>
        </table>
    </div>
</section>
{% endblock %}
